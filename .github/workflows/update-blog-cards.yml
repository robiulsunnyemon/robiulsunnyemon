name: Dynamic Hashnode Blog Cards

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual run anytime

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Blog Cards
        run: |
          cat << 'EOF' > update_cards.py
          import urllib.request
          import json
          import re

          url = "https://gql.hashnode.com"
          query = """
          query {
            publication(host: "robiulsuny.hashnode.dev") {
              posts(first: 2) {
                edges {
                  node {
                    title
                    brief
                    url
                    publishedAt
                    readTimeInMinutes
                    coverImage { url }
                  }
                }
              }
            }
          }
          """

          req = urllib.request.Request(
              url,
              data=json.dumps({"query": query}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "Mozilla/5.0"}
          )

          posts = []
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
                  posts = [e["node"] for e in data.get("data", {}).get("publication", {}).get("posts", {}).get("edges", [])]
          except Exception as e:
              print(f"API fetch note: {e}")

          if not posts:
              posts = [
                  {
                      "title": "AWS Academy Cloud Foundations (Module 02)",
                      "brief": "Cloud Economics and Billing (ক্লাউড অর্থনীতি এবং বিলিং)",
                      "url": "https://robiulsuny.hashnode.dev",
                      "readTimeInMinutes": 11,
                      "coverImage": {"url": "https://raw.githubusercontent.com/github/explore/main/topics/aws/aws.png"}
                  },
                  {
                      "title": "AWS Academy Cloud Foundations (Module 01)",
                      "brief": "১. ভূমিকা (Introduction) আজকের তথ্যপ্রযুক্তির যুগে Cloud Computing শব্দটি আমরা প্রতিনিয়ত শুনে থাকি...",
                      "url": "https://robiulsuny.hashnode.dev",
                      "readTimeInMinutes": 6,
                      "coverImage": {"url": "https://raw.githubusercontent.com/github/explore/main/topics/aws/aws.png"}
                  }
              ]

          cards_html = '<table width="100%" border="0" cellspacing="10" cellpadding="0">\n  <tr>\n'
          for p in posts[:2]:
              img = p.get("coverImage", {}).get("url") if p.get("coverImage") else "https://raw.githubusercontent.com/github/explore/main/topics/aws/aws.png"
              brief = p.get("brief", "")[:110] + "..." if len(p.get("brief", "")) > 110 else p.get("brief", "")
              read_time = p.get("readTimeInMinutes", 5)
              cards_html += f'''    <td width="50%" valign="top">
            <a href="{p['url']}" target="_blank">
              <img src="{img}" alt="{p['title']}" width="100%" style="border-radius: 8px; border: 1px solid #30363d; max-height: 220px; object-fit: cover;" />
            </a>
            <br/><br/>
            <a href="{p['url']}" target="_blank" style="text-decoration: none;">
              <h3>{p['title']}</h3>
            </a>
            <p>{brief}</p>
            <p><sub>⏱️ {read_time} min read</sub></p>
          </td>\n'''

          cards_html += '  </tr>\n</table>'

          try:
              with open("README.md", "r", encoding="utf-8") as f:
                  content = f.read()

              pattern = r"<!-- HASHNODE-CARDS:START -->.*?<!-- HASHNODE-CARDS:END -->"
              replacement = f"<!-- HASHNODE-CARDS:START -->\n{cards_html}\n<!-- HASHNODE-CARDS:END -->"
              new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("README.md cards successfully updated!")
          except Exception as err:
              print(f"File update note: {err}")
          EOF
          python update_cards.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update Hashnode blog cards"
            git push
          fi
