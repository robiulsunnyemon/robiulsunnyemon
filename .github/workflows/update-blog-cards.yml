name: Dynamic Hashnode Blog Cards

on:
  schedule:
    # Runs every 6 hours automatically to check for new posts
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to manually trigger update anytime with 1 click

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Hashnode Posts & Generate 2-Column Cards
        run: |
          python -c "
          import urllib.request, json, re

          # GraphQL query to Hashnode
          url = 'https://gql.hashnode.com'
          query = '''
          query {
            publication(host: \"robiulsuny.hashnode.dev\") {
              posts(first: 2) {
                edges {
                  node {
                    title
                    brief
                    url
                    publishedAt
                    readTimeInMinutes
                    coverImage { url }
                  }
                }
              }
            }
          }
          '''
          req = urllib.request.Request(
              url,
              data=json.dumps({'query': query}).encode('utf-8'),
              headers={'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0'}
          )
          
          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read().decode('utf-8'))
                  posts = [e['node'] for e in data['data']['publication']['posts']['edges']]
          except Exception as e:
              print('API Fetch fallback:', e)
              posts = []

          if posts:
              cards_html = '<table width=\"100%\" border=\"0\" cellspacing=\"10\" cellpadding=\"0\">\n  <tr>\n'
              for p in posts[:2]:
                  img = p.get('coverImage', {}).get('url') if p.get('coverImage') else 'https://raw.githubusercontent.com/github/explore/main/topics/aws/aws.png'
                  brief = p.get('brief', '')[:110] + '...' if len(p.get('brief', '')) > 110 else p.get('brief', '')
                  read_time = p.get('readTimeInMinutes', 5)
                  cards_html += f'''    <td width=\"50%\" valign=\"top\">
        <a href=\"{p['url']}\" target=\"_blank\">
          <img src=\"{img}\" alt=\"{p['title']}\" width=\"100%\" style=\"border-radius: 8px; border: 1px solid #30363d; max-height: 220px; object-fit: cover;\" />
        </a>
        <br/><br/>
        <a href=\"{p['url']}\" target=\"_blank\" style=\"text-decoration: none;\">
          <h3>{p['title']}</h3>
        </a>
        <p>{brief}</p>
        <p><sub>⏱️ {read_time} min read</sub></p>
      </td>\n'''
              cards_html += '  </tr>\n</table>'

              # Read README and replace content between markers
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              pattern = r'<!-- HASHNODE-CARDS:START -->.*?<!-- HASHNODE-CARDS:END -->'
              replacement = f'<!-- HASHNODE-CARDS:START -->\n{cards_html}\n<!-- HASHNODE-CARDS:END -->'
              new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

              with open('README.md', 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('Successfully updated README cards!')
          "

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Hashnode blog cards" && git push)
